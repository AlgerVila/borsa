[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "borsa"
version = "0.1.0"
description = "Nasdaq-100 ranking pipeline using Yahoo Finance data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.6",
  "pyarrow>=15.0",
  "requests>=2.31",
  "plotly>=5.24",
  "streamlit>=1.40",
  "tenacity>=8.2",
  "typer>=0.12",
  "yfinance>=0.2.51"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
borsa = "borsa.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
